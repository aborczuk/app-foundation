version: 1.1.8
last_updated: '2026-05-06T00:00:00Z'
manifest:
  version: 1.1.9
  updated_utc: '2026-05-06T00:00:00Z'
  ledger_sync_policy:
    - If pipeline_ledger.py, task_ledger.py, .speckit/*-ledger.jsonl schema, or any
      emitted event contract changes, update this manifest in the same PR.
    - On every ledger-contract change, bump version and update last_updated.
commands:
  speckit.specify:
    description: Deterministically bootstrap and complete a feature specification from natural language
    driver:
      mode: deterministic
      script_path: scripts/speckit_specify_step.py
      timeout_seconds: 300
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/python/create_new_feature.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/speckit_specify_step.py
    - scripts/speckit_codex_handoff_runner.py
    - scripts/speckit_spec_gate.py
    - scripts/pipeline_driver.py
    - scripts/pipeline_driver_state.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/spec.md
      template: spec-template.md
      scaffold_script: speckit_specify_step.py
      produced_by: scripts/speckit_specify_step.py
    emits:
    - event: backlog_registered
      required_fields: []
  speckit.run:
    description: Canonical Codex trigger for deterministic phase orchestration via pipeline driver
    driver:
      mode: deterministic
      script_path: scripts/pipeline_driver.py
      timeout_seconds: 300
      canonical_trigger: speckit.run
    scripts:
    - scripts/pipeline_driver.py
    - scripts/pipeline_driver_contracts.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: .speckit/runtime/${FEATURE_ID}/${RUN_SCOPE}-step-result.json
      produced_by: scripts/pipeline_driver.py
    emits: []
  speckit.clarify:
    description: Ask targeted clarification questions and encode answers into spec
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - scripts/pipeline_ledger.py
    artifacts: []
    emits:
    - event: spec_clarified
      required_fields: []
  speckit.split:
    description: Split an XL or L spec into smaller independently deliverable phase
      specs
    mode: legacy
    scripts:
    - .specify/scripts/python/create_new_feature.py
    - .specify/scripts/pipeline-scaffold.py
    artifacts:
    - output_path: ${FEATURE_DIR}/spec.md
      template: spec-template.md
      scaffold_script: create_new_feature.py
    - output_path: ${FEATURE_DIR}/checklists/requirements.md
      template: requirements-checklist-template.md
    emits: []
  speckit.checklist:
    description: Generate custom checklists for a feature based on user requirements
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    artifacts:
    - output_path: ${FEATURE_DIR}/checklists/${DOMAIN}.md
      template: checklist-template.md
    emits: []
  speckit.research:
    description: Legacy research command retained for compatibility; combined planning now folds research into speckit.plan
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/speckit_research_step.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/research.md
      template: research-template-compact.md
    - output_path: ${FEATURE_DIR}/discovery.md
      produced_by: scripts/speckit_research_step.py
    emits:
    - event: research_completed
      required_fields: []
  speckit.plan:
    description: Triage a spec, choose proportional research/plan/design depth, and produce one combined plan artifact
    driver:
      mode: generative
      timeout_seconds: 300
      canonical_trigger: speckit.run
    scripts:
    - .specify/scripts/pipeline-scaffold.py
    - scripts/read_code.py
    - scripts/speckit_plan_step.py
    - scripts/speckit_plan_gate.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/plan.md
      template: plan-template.md
      consumed_by:
      - speckit.solution
      - speckit.tasking
      produced_by: scripts/speckit_plan_step.py
    - output_path: ${FEATURE_DIR}/routing.json
      consumed_by:
      - speckit.solution
      - speckit.tasking
      - speckit.implement
      produced_by: scripts/speckit_plan_step.py
    emits:
    - event: duplicate_marked
      required_fields: []
    - event: plan_approved
      required_fields:
      - feasibility_required
  speckit.planreview:
    description: Identify underspecified areas in the current plan by asking targeted
      clarification questions
    driver:
      mode: generative
      timeout_seconds: 180
    scripts:
    - .specify/scripts/python/setup_plan.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/planreview.md
      template: plan-review-template.md
      consumed_by:
      - speckit.feasibilityspike
      - speckit.sketch
      - speckit.analyze
    emits:
    - event: planreview_completed
      required_fields:
      - fq_count
      - questions_asked
  speckit.feasibilityspike:
    description: Prove all Open Feasibility Questions in plan with targeted probes
    mode: legacy
    scripts:
    - .specify/scripts/python/setup_plan.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/spike.md
      template: spike-template.md
    emits:
    - event: feasibility_spike_completed
      required_fields:
      - spike_artifact
      - fq_count
    - event: feasibility_spike_failed
      required_fields:
      - failed_fq
  speckit.tasking:
    description: Decompose approved plan.md design slices into tasks.md, scaffold HUD tickets
      deterministically, fill them generatively, then stabilize the task graph and acceptance artifacts
    driver:
      mode: generative
      timeout_seconds: 300
      canonical_trigger: speckit.run
    scripts:
      - .specify/scripts/python/check_prerequisites.py
      - .specify/scripts/pipeline-scaffold.py
      - scripts/speckit_tasking_chain.py
      - scripts/speckit_tasking_codex_runner.py
      - scripts/speckit_remake_huds.py
      - .specify/scripts/acceptance-test-scaffold.py
      - scripts/speckit_tasks_gate.py
      - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/tasks.md
      template: tasks-template.md
      consumed_by:
      - speckit.estimate
      - speckit.breakdown
      - speckit.implement
    emits:
    - event: tasking_completed
      required_fields:
      - task_count
      - story_count
  speckit.tasking.hud-code:
    description: Scaffold a code-task HUD artifact for a task in the active feature directory
    mode: legacy
    scripts:
    - .specify/scripts/pipeline-scaffold.py
    artifacts:
    - output_path: ${FEATURE_DIR}/huds/${TASK_ID}.md
      template: hud-code-template.md
    emits: []
  speckit.tasking.hud-runbook:
    description: Scaffold a human-task runbook HUD artifact for a task in the active feature directory
    mode: legacy
    scripts:
    - .specify/scripts/pipeline-scaffold.py
    artifacts:
    - output_path: ${FEATURE_DIR}/huds/${TASK_ID}.md
      template: hud-runbook-template.md
    emits: []
  speckit.sketch:
    description: Legacy sketch command retained for compatibility; design slices now live in plan.md
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/sketch.md
      template: sketch-template.md
      consumed_by:
      - speckit.tasking
    emits:
    - event: sketch_completed
      required_fields: []
  speckit.estimate:
    description: Estimate fibonacci complexity for each task by evaluating codebase
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/estimates.md
      template: estimates-template.md
    - output_path: ${FEATURE_DIR}/huds/${TASK_ID}.md
      template: hud-code-template.md
    emits:
    - event: estimation_completed
      required_fields:
      - estimate_points
  speckit.breakdown:
    description: "Break down 8 or 13-point tasks in estimates.md into smaller pieces\
      \ (\u22645 points each)"
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    artifacts: []
    emits: []
  speckit.analyze:
    description: Perform cross-artifact consistency and quality analysis after task
      generation
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/analysis.md
      template: analysis-template.md
    emits:
    - event: analysis_completed
      required_fields:
      - critical_count
  speckit.solutionreview:
    description: 'Quality gate over sketch.md before tasking: validate sketch is complete,
      repo-grounded, and decomposition-ready'
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - .specify/scripts/pipeline-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/solutionreview.md
      template: solutionreview-template.md
      consumed_by:
      - speckit.tasking
    emits:
    - event: solutionreview_completed
      required_fields:
      - critical_count
      - high_count
  speckit.solution:
    description: Generate tasks from plan design slices and finalize solution approval without a Codex subrunner
    driver:
      mode: generative
      script_path: scripts/speckit_solution_step.py
      timeout_seconds: 300
      canonical_trigger: speckit.run
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - scripts/speckit_solution_step.py
    - scripts/speckit_tasking_chain.py
    - scripts/speckit_tasking_codex_runner.py
    - scripts/speckit_tasks_gate.py
    - scripts/task_ledger.py
    - scripts/speckit_remake_huds.py
    - .specify/scripts/pipeline-scaffold.py
    - .specify/scripts/acceptance-test-scaffold.py
    - scripts/pipeline_ledger.py
    artifacts:
    - output_path: ${FEATURE_DIR}/tasks.md
      produced_by: scripts/speckit_solution_step.py
    emits:
    - event: solution_approved
      required_fields:
      - task_count
      - story_count
      - estimate_points
  speckit.implement:
    description: Execute the next registered task through driver-owned approval, validation,
      QA, and closeout sequencing
    driver:
      mode: deterministic
      script_path: scripts/speckit_implement_step.py
      timeout_seconds: 300
      canonical_trigger: speckit.run
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - scripts/speckit_implement_step.py
    - scripts/speckit_gate_status.py
    - scripts/speckit_implement_gate.py
    - scripts/speckit_prepare_ignores.py
    - scripts/speckit_offline_qa_handoff.py
    - scripts/offline_qa.py
    - scripts/speckit_implement_docs.py
    - scripts/task_ledger.py
    - scripts/cgc_safe_index.py
    artifacts: []
    emits:
    - event: implementation_completed
      required_fields: []
  speckit.closeout:
    description: Close a completed task through the canonical append-first ledger path
      and finalize the feature when a user story ends
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    - scripts/speckit_closeout_task.py
    - scripts/task_ledger.py
    artifacts: []
    emits:
    - event: tests_passed
      required_fields: []
    - event: commit_created
      required_fields:
      - commit_sha
    - event: offline_qa_started
      required_fields: []
    - event: offline_qa_passed
      required_fields:
      - qa_run_id
    - event: task_closed
      required_fields: []
  speckit.retro:
    description: Generate a retrospective for the current feature
    mode: legacy
    scripts:
    - .specify/scripts/python/check_prerequisites.py
    artifacts:
      - output_path: "${FEATURE_DIR}/retro.md"
        template: "retro-template.md"
  speckit.constitution:
    description: Create or update the project constitution from interactive or provided
      principle inputs
    mode: legacy
    scripts:
    - scripts/validate_constitution_sync.py
    artifacts: []
    emits: []
manual_events:
  plan_started:
    required_fields: []
  feature_closed:
    required_fields: []
  e2e_generated:
    required_fields:
    - e2e_artifact
