[features]
goals = true

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.context7.tools.resolve-library-id]
approval_mode = "auto"

[mcp_servers.context7.tools.query-docs]
approval_mode = "auto"

[mcp_servers.composio]
url = "https://connect.composio.dev/mcp"
env_http_headers = { "x-consumer-api-key" = "COMPOSIO_API_KEY" }

# Read-only read-code MCP tools are auto-approved so normal repo reads do not
# require repeated prompts once a fresh Codex session loads this config.
[mcp_servers.read_code_persistence_probe]
command = "/Users/andreborczuk/app-foundation/.venv/bin/read_code_mcp_server"
args = ["-m", "src.mcp_codebase.project_backend_server"]

[mcp_servers.read_code_persistence_probe.tools.warmup]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.score_probe]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.health]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.query]
approval_mode = "approve"

[mcp_servers.read_code_persistence_probe.tools.score]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.read_code_context]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.read_code_analyze]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.read_code_find]
approval_mode = "approve"

[mcp_servers.read_code_persistence_probe.tools.read_code_window]
approval_mode = "approve"

[mcp_servers.read_code_persistence_probe.tools.get_process_identity]
approval_mode = "auto"

[mcp_servers.read_code_persistence_probe.tools.get_runtime_capabilities]
approval_mode = "auto"
